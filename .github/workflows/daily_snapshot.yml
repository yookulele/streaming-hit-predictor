name: Daily trailer snapshot

on:
  schedule:
    - cron: "7 16 * * *"   # every day at 16:07 UTC (8:07 am Pacific)
  workflow_dispatch:        # adds a "Run workflow" button to test it by hand

permissions:
  contents: write           # lets the job save the new rows back to the repo

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests python-dotenv

      - name: Take today's snapshot
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/ingest/snapshot_trailers.py

      - name: Save the new rows to GitHub
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data/snapshots/trailer_snapshots.csv
          git diff --cached --quiet || git commit -m "Trailer snapshot $(date -u +%F)"
          git push
